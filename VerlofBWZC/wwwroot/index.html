<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script>
        // Gsm/tablet: menu als schuiflade (zie MainLayout en theme.css)
        window.bwzcIsMobile = () => window.matchMedia("(max-width: 768px)").matches;

        // App installeren (PWA): de installatievraag van de browser bewaren tot de gebruiker op "Installeren" tikt
        window.bwzcInstall = (() => {
            let deferred = null;
            let dotnet = null;
            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferred = e;
                dotnet?.invokeMethodAsync('OnInstallChanged');
            });
            window.addEventListener('appinstalled', () => {
                deferred = null;
                dotnet?.invokeMethodAsync('OnInstallChanged');
            });
            const ua = navigator.userAgent || '';
            return {
                register: ref => { dotnet = ref; },
                state: () => ({
                    canPrompt: !!deferred,
                    standalone: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
                    ios: /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
                    mobile: window.matchMedia('(max-width: 768px)').matches || /android|iphone|ipad|ipod/i.test(ua)
                }),
                prompt: async () => {
                    if (!deferred) return 'unavailable';
                    const e = deferred;
                    deferred = null;
                    e.prompt();
                    const choice = await e.userChoice;
                    return choice.outcome;
                }
            };
        })();
        // Teamkalender: rij in beeld brengen
        window.bwzcScrollToId = (id) => document.getElementById(id)?.scrollIntoView({ block: "center", behavior: "smooth" });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
